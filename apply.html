              <div class="container">

    <h1 class="section-title">Loan Application Form</h1>

    <form id="loanForm">
        <label>Full Name</label>
        <input type="text" required>

        <label>Surname</label>
        <input type="text" required>

        <label>Age</label>
        <input type="number"  id="age"   required>

        <label>Loan Type</label>
        <select required>
            <option>Student</option>
            <option>Personal</option>
            <option>Business</option>
            <option>Emergency</option>
        </select>

        <label>Amount</label>
        <input type="number" id="amount" min="500" max="50000" required>

        <button type="submit">Submit Application</button>
    </form>

    <p id="successMsg" style="color:green; display:none;">
    Application submitted successfully!</p>

    <p id="ageError" style="color:red; display:none;"></p>

            <script>
document.getElementById("loanForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const msg = document.getElementById("successMsg");
    msg.style.display = "block";

    this.reset();

    setTimeout(() => {
        msg.style.display = "none";
    }, 3000); // disappears after 3 seconds
});
</script>
